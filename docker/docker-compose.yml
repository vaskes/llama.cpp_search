services:
  # DonSeTch HTTP MCP — web search, fetch, crawl, screenshot.
  # Anti-bot tier-2 browser solves CAPTCHAs, then 6 engines aggregate results.
  # Built locally from /opt/hound/Dockerfile with INSTALL_CHROME=true.
  # See docs/DONSETCH.md for full setup.
  donsetch-http:
    profiles: ["http"]
    build:
      context: /opt/hound
      args:
        INSTALL_CHROME: "true"
    image: donsetch-mcp:latest
    container_name: donsetch-http
    environment:
      DONSETCH_TRANSPORT: "http"
      DONSETCH_HTTP_HOST: "0.0.0.0"
      DONGHOST_NO_SANDBOX: "1"
      NO_COLOR: "1"
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8765"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 45s
    init: true
    volumes:
      - donsetch-cache:/home/donsetch/.cache/donsetch
    networks:
      - default
      - agent-stack_agent-net
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  donsetch-cache:

networks:
  agent-stack_agent-net:
    external: true
